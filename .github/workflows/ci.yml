# WP-2B (2B-4): continuous integration for Arch PLM.
# Verification only: no secrets, no database, no deployment, no publishing.
name: ci

on:
  push:
    branches:
      - hema-development
      - "hema/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (Node 22, Windows)
    # Windows on purpose: the app, the CLI workspace tools and the add-in run on
    # Windows, and workspace-materialize-core deliberately uses Windows path
    # semantics (path.win32) against the real filesystem in its tests.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # bash so `npm run lint -- --max-warnings=0` passes the flag through as-is.
        shell: bash
    env:
      # Placeholder only: Prisma client generation and `next build` need a
      # syntactically valid URL. No job step connects to a database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_placeholder
      AUTH_SECRET: ci-placeholder-not-a-secret-0000000000000000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Unit tests
        run: npm test
      - name: Route guard tests
        run: npm run test:routes
      - name: Route type generation
        run: npx next typegen
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Production build
        run: npx next build

  addin:
    name: add-in (.NET 8, Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        working-directory: cadconnect
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.427  # WP2B-L4: pinned to the locally tested SDK (TreatWarningsAsErrors)
      - name: Core tests
        run: dotnet test tests/Arch.CadConnect.Core.Tests/Arch.CadConnect.Core.Tests.csproj -c Release
      - name: Api tests
        run: dotnet test tests/Arch.CadConnect.Api.Tests/Arch.CadConnect.Api.Tests.csproj -c Release
      - name: Ui tests
        run: dotnet test tests/Arch.CadConnect.Ui.Tests/Arch.CadConnect.Ui.Tests.csproj -c Release
